---
layout: default
nav: writing
---
<article class="post">
  <header class="post-head">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
      {%- if page.tags and page.tags.size > 0 %}
      <span class="post-tags">
        {%- for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor -%}
      </span>
      {%- endif %}
    </p>
  </header>

  <div class="post-body">
    {{ content }}
  </div>
</article>

<p><a href="{{ '/' | relative_url }}">&larr; All writing</a></p>
