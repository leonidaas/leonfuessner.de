<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">

  <!-- PHASE 2: design. Everything below is deliberately minimal. -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-head">
    <a class="site-mark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/' | relative_url }}"{% if page.nav == 'writing' %} aria-current="page"{% endif %}>Writing</a>
      <a href="{{ '/now/' | relative_url }}"{% if page.nav == 'now' %} aria-current="page"{% endif %}>Now</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.nav == 'about' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.nav == 'projects' %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/cv/' | relative_url }}"{% if page.nav == 'cv' %} aria-current="page"{% endif %}>CV</a>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-foot">
    <p>
      <a href="https://github.com/{{ site.github_username }}">GitHub</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </p>
    <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author.name }}</p>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
