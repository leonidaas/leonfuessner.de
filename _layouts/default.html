<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Light/dark is prefers-color-scheme only; there is no toggle. The two
       theme-color values are the Flexoki paper and black page backgrounds. -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFCF0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#100F0F" media="(prefers-color-scheme: dark)">

  <!-- No webfonts. Type is set in the reader's own system stacks (see
       assets/css/style.css §01), so there is nothing to preload and no
       third-party request on this site at all. Do not add one. -->

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  {%- if page.date %}
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
  {%- endif %}
  <meta name="twitter:card" content="summary">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-head">
    <a class="site-mark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/' | relative_url }}"{% if page.nav == 'writing' %} aria-current="page"{% endif %}>Writing</a>
      <a href="{{ '/now/' | relative_url }}"{% if page.nav == 'now' %} aria-current="page"{% endif %}>Now</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.nav == 'about' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.nav == 'projects' %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/cv/' | relative_url }}"{% if page.nav == 'cv' %} aria-current="page"{% endif %}>CV</a>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-foot">
    <!-- Social links. Every destination comes from _config.yml, so this list
         and the /cv/ contact rail can never drift apart. There is deliberately
         no email address here, or anywhere else on this site.

         X / TWITTER: the link is deliberately absent, because the handle has
         not been confirmed. It renders here automatically the moment
         `twitter_username` is set in _config.yml (see the marked block
         there). Do not hardcode a handle and do not guess one. -->
    <p class="site-foot-links">
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="https://github.com/{{ site.github_username }}" rel="me">GitHub</a>
      {%- if site.linkedin_url %}
      <a href="{{ site.linkedin_url }}" rel="me">LinkedIn</a>
      {%- endif %}
      {%- if site.twitter_username %}
      <a href="https://x.com/{{ site.twitter_username }}" rel="me">X</a>
      {%- endif %}
    </p>
    <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author.name }}</p>
  </footer>

  <!-- Optional. Nothing on this site needs JavaScript to render. -->
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
