title: Leon Fuessner
description: >-
  Writing by Leon Fuessner.

author:
  name: Leon Fuessner
  # NO `email:` KEY, DELIBERATELY. The address is off the site entirely — off
  # /cv/, and out of the feed (jekyll-feed emits <email> under <author> if it
  # finds one here). Contact goes through the social links below instead.
  # Do not add it back.

# ---------------------------------------------------------------------------
# SOCIAL LINKS
# Rendered by the footer (_layouts/default.html) and the /cv/ contact rail
# (_includes/cv.html). Both read these keys, so a link added here appears in
# both places.
# ---------------------------------------------------------------------------
github_username: leonidaas
linkedin_url: https://www.linkedin.com/in/leon-fuessner-bab212170

# >>> X / TWITTER GOES HERE. <<<
# Not set, because the handle has not been confirmed by the site owner, and a
# wrong handle points visitors at a stranger's account. Do not guess one.
# To add it: uncomment the line below and replace the placeholder with the
# real handle, bare, without the leading "@". Nothing else needs changing —
# the footer and the /cv/ contact rail both render the link the moment this
# key exists.
#
twitter_username: leon_fuessner

# ---------------------------------------------------------------------------
# BASEURL — the DNS cutover is DONE (2026-08-18)
#
# The site is served from the apex custom domain leonfuessner.de, so there is
# no path prefix and `baseurl` is empty. The CNAME file at the repo root is
# what tells GitHub Pages to serve this domain — do not delete it.
#
# Because baseurl is now empty, a plain Markdown link like [x](/about/) works
# correctly, and images in posts no longer need the `relative_url` wrapper.
# Existing `relative_url` calls stay correct either way; leave them.
# ---------------------------------------------------------------------------
baseurl: ""
url: "https://leonfuessner.de"

# Matches the convention already used by the cv_2025 site.
permalink: /blog/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  # Leave $...$ / $$...$$ as text. KaTeX renders them in the browser, and
  # only on pages that contain math. The default mathjax engine would wrap
  # them in <script type="math/tex"> and the site would need a CDN.
  math_engine: null

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Posts are the only content type; every post shares one stream.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTEXT.md
  - WRITING.md
  - docs
  - script
  - vendor
  - .jekyll-cache
  # The publishing vault's own furniture. `.obsidian` holds the vault config;
  # `_templates` holds the post template. Jekyll already skips any directory
  # whose name starts with an underscore, so `_templates` is belt-and-braces —
  # it is listed to say out loud that it must never be published.
  - .obsidian
  - _templates
